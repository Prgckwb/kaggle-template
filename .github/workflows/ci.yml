name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8

      # Python バージョンは .python-version を uv が自動で参照する
      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check src/ app/ tests/

      - name: Format check
        run: uv run ruff format --check src/ app/ tests/

      - name: Test
        run: uv run --with scikit-learn pytest
