[project]
name = "kaggle-template"
version = "0.1.0"
description = "Kaggle competition template"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "hydra-core>=1.3",
    "wandb",
    "polars",
    "pandas",
    "numpy",
    "pyyaml",
]

[project.optional-dependencies]
torch = [
    "torch>=2.0",
    "lightning>=2.0",
    "torchmetrics",
    "scikit-learn",
]
tabular = [
    "lightgbm",
    "xgboost",
    "catboost",
    "scikit-learn",
]

[dependency-groups]
dev = [
    "jupyter",
    "kaggle",
]
