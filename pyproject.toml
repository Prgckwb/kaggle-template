[project]
name = "kaggle-template"
version = "0.1.0"
description = "Kaggle competition template"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "hydra-core>=1.3",
    "wandb",
    "polars",
    "pandas",
]

[project.optional-dependencies]
torch = [
    "torch>=2.0",
    "lightning>=2.0",
    "torchmetrics",
    "scikit-learn",
    "numpy",
]
tabular = [
    "lightgbm",
    "xgboost",
    "catboost",
    "scikit-learn",
    "numpy",
]

[dependency-groups]
dev = [
    "jupyter",
    "ruff",
    "ty",
    "pre-commit",
    "fastapi",
    "uvicorn",
    "jinja2",
    "kaggle",
    "markdown",
    "nh3",
]
