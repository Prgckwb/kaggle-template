# Experiment configuration
defaults:
  - _self_

# Experiment
exp_name: exp000_sample
run_name: run000-base
seed: 42

# Run mode: debug / fold0 / full
# - debug: パイプライン確認（少数データ・少数バッチ・1エポック・1fold・wandb disabled）
# - fold0: fold0 のみ実行（デフォルト）
# - full: 全 fold 実行
run_mode: fold0

# Debug settings (run_mode=debug 時に適用)
debug:
  epochs: 1
  samples: 100
  limit_train_batches: 2
  limit_val_batches: 2
  n_folds: 1

# Data
data:
  train_path: ${hydra:runtime.cwd}/input/train.csv
  test_path: ${hydra:runtime.cwd}/input/test.csv
  n_folds: 5

# Model
model:
  name: baseline

# Training
training:
  epochs: 10
  batch_size: 32
  lr: 1e-3

# Output
output_dir: ${hydra:runtime.cwd}/src/${exp_name}/output/${run_name}
logs_dir: ${hydra:runtime.cwd}/src/${exp_name}/logs/${run_name}

# Wandb
wandb:
  project: kaggle-competition
  entity: null  # Set your wandb entity
  mode: online  # online, offline, disabled

# Hydra settings
hydra:
  run:
    dir: .
  job:
    chdir: false
  output_subdir: null
