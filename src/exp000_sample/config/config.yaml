# exp000_sample のベース config（この実験の設定の唯一の置き場。スキーマ dataclass は持たない）
# - CLI のタイポ（training.lrr=1）は Hydra の struct モードが起動時に弾く
# - 小実験 yaml のタイポ（親に無いキー）は src/utils/lineage.py が起動時に弾く
# - コンペ固有値は docs/competition-profile.yaml から ${profile:...} で読む（転記しない）

exp_name: exp000_sample
run_name: run000-base
seed: 42

# debug: 少数データ・少数バッチで fold0 を 1 epoch（wandb 無効、出力は *-debug/ に隔離）
# fold0: fold0 のみ（既定。docs/competition-profile.yaml の workflow.default_run_mode）
# full : 全 fold + OOF + summary run
run_mode: fold0

debug:
  epochs: 1
  samples: 256
  limit_train_batches: 2
  limit_val_batches: 2

metric:
  name: ${profile:metric.name}
  mode: ${profile:metric.mode}

# ⚠ このサンプルは合成データ（uv run python -m src.exp000_sample.make_synthetic）を読む。
#   実コンペの exp では次の 2 行を実データ用に戻す:
#     input_dir:  ${oc.env:INPUT_DIR,${hydra:runtime.cwd}/input}
#     folds_path: ${hydra:runtime.cwd}/data/folds/folds_${data.fold_version}.csv
#   Kaggle 上のマウントパスは docs/training-conventions.md の「実行環境」。
data:
  input_dir: ${hydra:runtime.cwd}/sandbox/synthetic
  train_path: ${data.input_dir}/train.csv
  test_path: ${data.input_dir}/test.csv
  sample_submission_path: ${data.input_dir}/sample_submission.csv
  id_col: id
  target_col: target
  # fold 割当は全実験で共有するファイル（初回に作成、以後不変）。戦略を変えるなら fold_version を上げる
  fold_version: v1
  folds_path: ${data.input_dir}/folds_${data.fold_version}.csv
  n_folds: 5
  cv_strategy: stratified  # kfold | stratified | group | stratified_group | timeseries
  group_col: null
  # 前処理・ラベルの世代（wandb tags に入る。世代を跨いで CV を比較しない）
  data_version: null
  label_version: null

model:
  hidden_dim: 64
  dropout: 0.1

training:
  epochs: 10
  batch_size: 128
  lr: 1e-3
  num_workers: 0
  save_top_k: 1

output_dir: ${hydra:runtime.cwd}/src/${exp_name}/output/${run_name}
logs_dir: ${hydra:runtime.cwd}/src/${exp_name}/logs/${run_name}

wandb:
  project: ${profile:wandb.project}
  entity: null
  mode: online  # online | offline | disabled

hydra:
  run:
    dir: .
  job:
    chdir: false
  output_subdir: null
