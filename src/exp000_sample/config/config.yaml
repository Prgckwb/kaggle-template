# Experiment configuration
defaults:
  - base_schema  # config_schema.py の dataclass（タイポ・型違いを実行時に検出）
  - _self_

# Experiment
exp_name: exp000_sample
run_name: run000-base
seed: 42

# Run mode: debug / fold0 / full
# - debug: パイプライン確認（少数データ・少数バッチ・1エポック・1fold・wandb disabled）
# - fold0: fold0 のみ実行（デフォルト）
# - full: 全 fold 実行
run_mode: fold0

# 系譜（親 run と、親から変えたキー）。
# ベース config は parent: config / varied: [] のまま。
# 小実験（run{NNN}-*.yaml）では親 run 名と変えたキーを必ず書く。
lineage:
  parent: config
  varied: []

# Debug settings (run_mode=debug 時に適用)
debug:
  epochs: 1
  samples: 100
  limit_train_batches: 2
  limit_val_batches: 2
  n_folds: 1

# Metric（docs/competition-profile.yaml と揃える。/kaggle:init で設定）
# - name: wandb キー（val/{name}）・チェックポイント名・CV 集計に使う短い英小文字名
# - mode: max = 大きいほど良い / min = 小さいほど良い
# このサンプルはダミーの損失をスコアとして扱うため loss/min にしている
metric:
  name: loss
  mode: min
  # docs/competition-profile.yaml の metric.noise を転記する。
  # 最初のベースラインが完走したら seed のみ変えた run を焼いて seed_spread を埋める。
  noise:
    seed_spread: null
    fold0_resolution: null
    proxy_resolution: null

# Data
# input_dir は環境変数 INPUT_DIR で上書きできる（例: Kaggle Notebook では
# INPUT_DIR=/kaggle/input/{slug}）。未設定ならローカルの input/ を使う。
data:
  input_dir: ${oc.env:INPUT_DIR,${hydra:runtime.cwd}/input}
  train_path: ${data.input_dir}/train.csv
  test_path: ${data.input_dir}/test.csv
  sample_submission_path: ${data.input_dir}/sample_submission.csv
  n_folds: 5
  # データの世代（任意）。設定すると wandb の tags に入り、世代跨ぎの比較を防げる。
  # ⚠ 異なるバージョン間で CV スコアを比較しない
  fold_version: null
  data_version: null
  label_version: null

# Model
model:
  name: baseline

# Training
training:
  epochs: 10
  batch_size: 32
  lr: 1e-3

# Output
output_dir: ${hydra:runtime.cwd}/src/${exp_name}/output/${run_name}
logs_dir: ${hydra:runtime.cwd}/src/${exp_name}/logs/${run_name}

# Wandb
wandb:
  project: kaggle-competition
  entity: null  # Set your wandb entity
  mode: online  # online, offline, disabled

# Hydra settings
hydra:
  run:
    dir: .
  job:
    chdir: false
  output_subdir: null
