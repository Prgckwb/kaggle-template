{% macro empty_state(message="データがありません", icon="fa-inbox", action_text="", action_url="", hint="") %}
<div class="text-center py-12">
    <div class="inline-flex items-center justify-center w-16 h-16 bg-gray-100 dark:bg-gray-700 rounded-full mb-4">
        <i class="fa-solid {{ icon }} text-gray-400 dark:text-gray-500 text-2xl" aria-hidden="true"></i>
    </div>
    <p class="text-gray-500 dark:text-gray-400 font-semibold">{{ message }}</p>
    {% if hint %}
    <p class="mt-2 text-xs text-gray-400 dark:text-gray-500 max-w-md mx-auto leading-relaxed">{{ hint }}</p>
    {% endif %}
    {% if action_text %}
    <a href="{{ action_url }}" class="mt-3 inline-block text-emerald-600 dark:text-emerald-400 font-bold text-sm hover:underline">
        {{ action_text }}
    </a>
    {% endif %}
</div>
{% endmacro %}
