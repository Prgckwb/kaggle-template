{% macro metric_card(label, value, icon="fa-chart-line", color="emerald", subtitle="") %}
<div class="bg-white dark:bg-gray-800 rounded-2xl p-5 shadow-sm border border-gray-200 dark:border-gray-700">
    <div class="flex items-center gap-3 mb-2">
        <div class="w-10 h-10 bg-{{ color }}-50 dark:bg-{{ color }}-900/30 rounded-xl flex items-center justify-center">
            <i class="fa-solid {{ icon }} text-{{ color }}-500"></i>
        </div>
        <span class="text-sm font-semibold text-gray-500 dark:text-gray-400">{{ label }}</span>
    </div>
    <p class="text-2xl font-extrabold text-gray-800 dark:text-gray-100">{{ value if value and value != '-' else '-' }}</p>
    {% if subtitle %}
    <p class="text-xs text-gray-400 dark:text-gray-500 mt-1">{{ subtitle }}</p>
    {% endif %}
</div>
{% endmacro %}
