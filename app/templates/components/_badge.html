{% macro badge(text, color="gray", icon="") %}
<span class="inline-flex items-center gap-1.5 bg-{{ color }}-50 dark:bg-{{ color }}-900/30 text-{{ color }}-600 dark:text-{{ color }}-400 rounded-full px-3 py-1 text-xs font-semibold">
    {% if icon %}<i class="fa-solid {{ icon }} text-xs"></i>{% endif %}
    {{ text }}
</span>
{% endmacro %}
