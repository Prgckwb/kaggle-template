{% for f in files %}
<li>
    {% if f.is_dir %}
    <div class="flex items-center cursor-pointer hover:bg-gray-50 rounded-lg transition-colors"
         onclick="clickDataDir(this)">
        <span class="p-1 text-gray-400 hover:text-gray-600 transition-colors data-dir-btn"
              hx-get="/data/tree/{{ f.path }}"
              hx-target="next ul"
              hx-swap="innerHTML"
              hx-trigger="loadChildren once">
            <i class="fa-solid fa-chevron-right text-xs transition-transform duration-200"></i>
        </span>
        <i class="fa-solid fa-folder text-amber-400 w-4 text-center mx-1"></i>
        <span class="text-sm font-semibold text-gray-700 truncate flex-1">{{ f.name }}</span>
        <span class="text-xs text-gray-400 ml-auto mr-2">{{ f.child_count }}</span>
    </div>
    <ul class="ml-4 hidden"></ul>
    {% else %}
    <a href="/data/preview/{{ f.path }}"
       hx-get="/data/preview/{{ f.path }}"
       hx-target="#data-content"
       hx-push-url="true"
       class="flex items-center gap-2 px-3 py-1.5 rounded-lg text-sm font-semibold text-gray-500 hover:bg-gray-50 hover:text-gray-800 transition-all">
        <i class="fa-solid {{ data_file_icon(f.type) }} w-4 text-center text-gray-400"></i>
        <span class="truncate flex-1">{{ f.name }}</span>
        <span class="text-xs text-gray-400">{{ f.size | filesize }}</span>
    </a>
    {% endif %}
</li>
{% endfor %}
