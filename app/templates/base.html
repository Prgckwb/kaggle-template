<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dashboard{% endblock %} - Kaggle Dashboard</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">

    <!-- ローカル配信アセット（オフライン対応）: 再ビルドは app/static/build/README.md 参照 -->
    <link rel="stylesheet" href="/static/css/fonts.css">
    <link rel="stylesheet" href="/static/css/fontawesome.min.css">
    <link rel="stylesheet" href="/static/css/app.css">
    <!-- Dark mode: apply immediately to prevent FOUC -->
    <script>
        (function() {
            var stored = localStorage.getItem('theme');
            if (stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>

    <!-- htmx (local) -->
    <script src="/static/js/htmx.min.js"></script>
    <script>
        htmx.config.historyCacheSize = 0;
        htmx.config.refreshOnHistoryMiss = true;
    </script>

    <!-- highlight.js (local) -->
    <link rel="stylesheet" href="/static/css/highlight-github.min.css">
    <script src="/static/js/highlight.min.js"></script>
    <script src="/static/js/highlight-yaml.min.js"></script>
    <script src="/static/js/highlight-python.min.js"></script>
    <script src="/static/js/highlight-json.min.js"></script>
    <script src="/static/js/highlight-bash.min.js"></script>

    <!-- Mermaid (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
    <script>mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', theme: document.documentElement.classList.contains('dark') ? 'dark' : 'neutral' });</script>

    <style>
        body { font-family: 'Nunito', system-ui, sans-serif; }
        .htmx-indicator { opacity: 0; transition: opacity 200ms ease-in; }
        .htmx-request .htmx-indicator, .htmx-request.htmx-indicator { opacity: 1; }
        .tab-btn.active { background: white; color: #1f2937; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }

        /* highlight.js emerald accent overrides */
        .hljs { background: #f9fafb; border-radius: 0.75rem; }
        .hljs-keyword { color: #059669; }
        .hljs-string { color: #0284c7; }
        .hljs-number { color: #d97706; }
        .hljs-comment { color: #9ca3af; font-style: italic; }
        .hljs-literal { color: #059669; }
        .hljs-attr { color: #6d28d9; }

        /* Dark mode overrides */
        .dark .hljs { background: #111827; }
        .dark .tab-btn.active { background: #1f2937; color: #f3f4f6; box-shadow: 0 1px 2px rgba(0,0,0,0.2); }

        /* --- サイドバーのレスポンシブ制御 --------------------------------
           モバイル(<lg): ドロワー式（デフォルト非表示、body.sidebar-open で表示）
           デスクトップ(lg+): デフォルト表示、body.sidebar-collapsed で非表示 */
        #sidebar { transition: transform 300ms ease-in-out; transform: translateX(-100%); }
        #main-content { transition: margin-left 300ms ease-in-out; margin-left: 0; }
        #sidebar-open-btn { display: flex; }
        #sidebar-backdrop { display: none; }
        body.sidebar-open #sidebar { transform: none; }
        body.sidebar-open #sidebar-open-btn { display: none; }
        body.sidebar-open #sidebar-backdrop { display: block; }
        @media (min-width: 1024px) {
            #sidebar { transform: none; }
            #main-content { margin-left: 16rem; }
            #sidebar-open-btn { display: none; }
            body.sidebar-open #sidebar-backdrop { display: none; }
            body.sidebar-collapsed #sidebar { transform: translateX(-100%); }
            body.sidebar-collapsed #main-content { margin-left: 0; }
            body.sidebar-collapsed #sidebar-open-btn { display: flex; }
        }

        /* キーボード操作時のフォーカスリング */
        a:focus-visible, button:focus-visible, input:focus-visible, [tabindex]:focus-visible {
            outline: 2px solid #10b981;
            outline-offset: 2px;
            border-radius: 4px;
        }

        /* Print styles for PDF export */
        @media print {
            #sidebar, #global-indicator, #image-modal, #sidebar-open-btn, .no-print {
                display: none !important;
            }
            #main-content {
                margin-left: 0 !important;
                max-width: none !important;
                width: 100% !important;
            }
            * {
                print-color-adjust: exact;
                -webkit-print-color-adjust: exact;
            }
            @page { size: A4; margin: 14mm 12mm; }
            body {
                background: white !important;
                color: #1f2937 !important;
                font-size: 10.5pt;
            }
            [class*="shadow-"] { box-shadow: none !important; }
            *, *::before, *::after {
                transition: none !important;
                animation: none !important;
            }
            pre { white-space: pre-wrap !important; word-break: break-all; }
            thead { display: table-header-group; }
            h1, h2, h3, h4 { break-after: avoid; }
            .grid > *, table, pre, h1, h2, h3, h4, blockquote, figure, img {
                break-inside: avoid;
            }
            a[href^="http"]::after {
                content: " (" attr(href) ")";
                font-size: 0.75em;
                color: #6b7280;
                word-break: break-all;
            }
            nav a[href]::after, .no-print-url a::after { content: none !important; }
        }
    </style>

    {% block head %}{% endblock %}
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100" hx-indicator="#global-indicator">

    <!-- キーボード操作用スキップリンク -->
    <a href="#main-content" class="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-50 focus:bg-white dark:focus:bg-gray-800 focus:px-4 focus:py-2 focus:rounded-lg focus:shadow-md text-sm font-bold text-emerald-600">メインコンテンツへスキップ</a>

    <!-- Global htmx loading indicator -->
    <div id="global-indicator" class="htmx-indicator fixed top-0 left-0 right-0 z-50">
        <div class="h-1 bg-emerald-500 rounded-full animate-pulse"></div>
    </div>

    <div class="flex min-h-screen">

        <!-- モバイルドロワー用バックドロップ -->
        <div id="sidebar-backdrop" class="fixed inset-0 bg-black/40 z-20 lg:hidden" onclick="toggleSidebar()" aria-hidden="true"></div>

        <!-- Sidebar -->
        <aside id="sidebar" class="fixed inset-y-0 left-0 w-64 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 flex flex-col z-30">
            <!-- Brand + Toggle -->
            <div class="px-5 py-5 flex items-center justify-between">
                <a href="/" class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-emerald-500 rounded-xl flex items-center justify-center">
                        <i class="fa-solid fa-trophy text-white text-lg"></i>
                    </div>
                    <span class="text-lg font-extrabold text-gray-800 dark:text-gray-100">Kaggle</span>
                </a>
                <button onclick="toggleSidebar()" class="text-gray-400 dark:text-gray-500 hover:text-gray-600 dark:hover:text-gray-300 transition-colors p-1 cursor-pointer" title="サイドバーを閉じる" aria-label="サイドバーを閉じる">
                    <i class="fa-solid fa-chevron-left text-sm" aria-hidden="true"></i>
                </button>
            </div>

            <!-- Global Search -->
            <div class="px-3 mb-2 relative" id="search-container">
                <div class="flex items-center gap-2 bg-gray-50 dark:bg-gray-700 rounded-xl px-3 py-2">
                    <i class="fa-solid fa-magnifying-glass text-gray-400 dark:text-gray-500 text-xs"></i>
                    <input type="search"
                           id="global-search-input"
                           name="q"
                           placeholder="検索..."
                           autocomplete="off"
                           aria-label="サイト内検索"
                           role="combobox"
                           aria-expanded="false"
                           aria-controls="global-search-results"
                           hx-get="/search"
                           hx-trigger="keyup changed delay:300ms, search"
                           hx-target="#global-search-results"
                           hx-push-url="false"
                           onfocus="openSearch()"
                           oninput="if(!this.value) closeSearch()"
                           class="flex-1 bg-transparent outline-none text-sm text-gray-800 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500 min-w-0">
                </div>
                <div id="global-search-results"
                     role="listbox"
                     aria-label="検索結果"
                     class="hidden absolute left-3 right-3 top-full mt-1 bg-white dark:bg-gray-800 rounded-xl shadow-lg border border-gray-200 dark:border-gray-700 z-50">
                </div>
            </div>

            <!-- Navigation (scrollable) -->
            <nav class="flex-1 px-3 flex flex-col gap-1 overflow-y-auto">
                <!-- Home -->
                <a href="/"
                   class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-semibold transition-all
                          {% if active_page == 'home' %}bg-emerald-50 dark:bg-emerald-900/30 text-emerald-600 dark:text-emerald-400{% else %}text-gray-500 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-gray-700 hover:text-gray-800 dark:hover:text-gray-100{% endif %}">
                    <i class="fa-solid fa-house w-5 text-center"></i>
                    Home
                </a>

                <!-- Experiments (simple link, no sub-items) -->
                <a href="/experiments"
                   class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-semibold transition-all
                          {% if active_page == 'experiments' %}bg-emerald-50 dark:bg-emerald-900/30 text-emerald-600 dark:text-emerald-400{% else %}text-gray-500 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-gray-700 hover:text-gray-800 dark:hover:text-gray-100{% endif %}">
                    <i class="fa-solid fa-flask w-5 text-center"></i>
                    Experiments
                </a>

                <!-- Data (no sub-items) -->
                <a href="/data"
                   class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-semibold transition-all
                          {% if active_page == 'data' %}bg-emerald-50 dark:bg-emerald-900/30 text-emerald-600 dark:text-emerald-400{% else %}text-gray-500 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-gray-700 hover:text-gray-800 dark:hover:text-gray-100{% endif %}">
                    <i class="fa-solid fa-database w-5 text-center"></i>
                    Data
                </a>

                <!-- Knowledge (with collapsible sub-items) -->
                <div>
                    <div class="flex items-center">
                        <a href="/knowledge"
                           class="flex-1 flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-semibold transition-all
                                  {% if active_page == 'knowledge' %}bg-emerald-50 dark:bg-emerald-900/30 text-emerald-600 dark:text-emerald-400{% else %}text-gray-500 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-gray-700 hover:text-gray-800 dark:hover:text-gray-100{% endif %}">
                            <i class="fa-solid fa-book w-5 text-center"></i>
                            Knowledge
                        </a>
                        <button onclick="toggleSubnav('knowledge-sub', this)"
                                class="px-2 py-2.5 text-gray-400 dark:text-gray-500 hover:text-gray-600 dark:hover:text-gray-300 transition-colors cursor-pointer"
                                aria-label="Knowledge サブメニューを開閉">
                            <i class="fa-solid fa-chevron-down text-xs transition-transform duration-200" aria-hidden="true"></i>
                        </button>
                    </div>
                    <div id="knowledge-sub" class="hidden ml-8 mt-0.5">
                        {% for item in knowledge_subnav %}
                        <a href="/knowledge/{{ item.key }}"
                           class="block px-3 py-1.5 rounded-lg text-xs font-semibold transition-all
                                  {% if active_subpage is defined and active_subpage == item.key %}bg-emerald-50 dark:bg-emerald-900/30 text-emerald-600 dark:text-emerald-400{% else %}text-gray-500 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-gray-700 hover:text-gray-800 dark:hover:text-gray-100{% endif %}">
                            <i class="fa-solid {{ item.icon }} w-4 text-center mr-1"></i>
                            {{ item.label }}
                        </a>
                        {% endfor %}
                    </div>
                </div>

                {% block sidebar_nav %}{% endblock %}
            </nav>

            <!-- Sidebar Footer -->
            <div class="px-4 py-3 border-t border-gray-200 dark:border-gray-700 flex items-center justify-end">
                <button onclick="toggleDarkMode()" id="dark-mode-toggle"
                        class="w-8 h-8 rounded-lg flex items-center justify-center text-gray-400 dark:text-gray-500 hover:text-gray-600 dark:hover:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 transition-all cursor-pointer"
                        title="ダークモード切替" aria-label="ダークモード切替">
                    <i id="dark-mode-icon" class="fa-solid fa-moon text-sm" aria-hidden="true"></i>
                </button>
            </div>
        </aside>

        <!-- Sidebar open button (sidebar 非表示時に表示。表示制御は CSS 側) -->
        <button onclick="toggleSidebar()" id="sidebar-open-btn"
                class="fixed top-4 left-4 z-20 w-10 h-10 bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 items-center justify-center text-gray-500 dark:text-gray-400 hover:text-gray-800 dark:hover:text-gray-100 transition-all cursor-pointer"
                title="サイドバーを開く" aria-label="サイドバーを開く">
            <i class="fa-solid fa-bars" aria-hidden="true"></i>
        </button>

        <!-- Main Content -->
        <main id="main-content" class="flex-1 px-4 sm:px-6 lg:px-8 pb-8 pt-16 lg:pt-8">
            <div class="{% block content_width %}max-w-5xl mx-auto{% endblock %}">
                {% block content %}{% endblock %}
            </div>
        </main>

    </div>

    <script>
        // Sidebar toggle
        // - デスクトップ(lg+): body.sidebar-collapsed を localStorage で永続化
        // - モバイル(<lg): body.sidebar-open のドロワー（永続化しない）
        var _desktopQuery = window.matchMedia('(min-width: 1024px)');

        (function() {
            if (localStorage.getItem('sidebar-collapsed') === 'true') {
                document.body.classList.add('sidebar-collapsed');
            }

            // Restore subnav expand state
            document.querySelectorAll('[id$="-sub"]').forEach(function(el) {
                var key = 'subnav-' + el.id;
                if (localStorage.getItem(key) === 'open') {
                    el.classList.remove('hidden');
                    var btn = el.previousElementSibling
                        ? el.previousElementSibling.querySelector('button i.fa-chevron-down')
                        : null;
                    if (btn) btn.classList.add('rotate-180');
                }
            });

            // Auto-expand Knowledge subnav when on a knowledge page
            var activePage = {{ active_page | default("") | tojson }};
            if (activePage === 'knowledge') {
                var knowledgeSub = document.getElementById('knowledge-sub');
                if (knowledgeSub && knowledgeSub.classList.contains('hidden')) {
                    knowledgeSub.classList.remove('hidden');
                    var btn = knowledgeSub.previousElementSibling
                        ? knowledgeSub.previousElementSibling.querySelector('button i.fa-chevron-down')
                        : null;
                    if (btn) btn.classList.add('rotate-180');
                    localStorage.setItem('subnav-knowledge-sub', 'open');
                }
            }
        })();

        function toggleSidebar() {
            if (_desktopQuery.matches) {
                var collapsed = document.body.classList.toggle('sidebar-collapsed');
                localStorage.setItem('sidebar-collapsed', collapsed ? 'true' : 'false');
            } else {
                document.body.classList.toggle('sidebar-open');
            }
        }

        // モバイルドロワーはナビゲーション後に閉じる（ブラウザバック時の残留防止）
        window.addEventListener('pageshow', function() {
            document.body.classList.remove('sidebar-open');
        });

        // Global search（キーボード操作対応: ↑↓ で選択、Enter で開く、Escape で閉じる）
        var _searchActiveIndex = -1;

        function _searchItems() {
            return Array.from(document.querySelectorAll('#global-search-results a'));
        }
        function _setSearchExpanded(expanded) {
            var input = document.getElementById('global-search-input');
            if (input) input.setAttribute('aria-expanded', expanded ? 'true' : 'false');
        }
        function _highlightSearchItem(items, index) {
            items.forEach(function(el, i) {
                el.classList.toggle('bg-gray-100', i === index);
                el.classList.toggle('dark:bg-gray-700', i === index);
            });
            if (index >= 0 && items[index]) {
                items[index].scrollIntoView({ block: 'nearest' });
            }
        }
        function openSearch() {
            var results = document.getElementById('global-search-results');
            if (document.getElementById('global-search-input').value.trim()) {
                results.classList.remove('hidden');
                _setSearchExpanded(true);
            }
        }
        function closeSearch() {
            document.getElementById('global-search-results').classList.add('hidden');
            _setSearchExpanded(false);
            _searchActiveIndex = -1;
        }
        document.getElementById('global-search-input').addEventListener('keydown', function(e) {
            var items = _searchItems();
            if (e.key === 'Escape') {
                closeSearch();
                this.blur();
                return;
            }
            if (!items.length) return;
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                _searchActiveIndex = (_searchActiveIndex + 1) % items.length;
                _highlightSearchItem(items, _searchActiveIndex);
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                _searchActiveIndex = (_searchActiveIndex - 1 + items.length) % items.length;
                _highlightSearchItem(items, _searchActiveIndex);
            } else if (e.key === 'Enter' && _searchActiveIndex >= 0 && items[_searchActiveIndex]) {
                e.preventDefault();
                items[_searchActiveIndex].click();
            }
        });
        document.addEventListener('click', function(e) {
            var container = document.getElementById('search-container');
            if (container && !container.contains(e.target)) {
                closeSearch();
            }
        });
        document.body.addEventListener('htmx:afterSwap', function(e) {
            if (e.detail.target.id === 'global-search-results') {
                var results = document.getElementById('global-search-results');
                var isEmpty = !results.innerHTML.trim();
                results.classList.toggle('hidden', isEmpty);
                _setSearchExpanded(!isEmpty);
                _searchActiveIndex = -1;
            }
        }, true);

        function toggleSubnav(id, btn) {
            var el = document.getElementById(id);
            var isHidden = el.classList.contains('hidden');
            el.classList.toggle('hidden');
            btn.querySelector('i').classList.toggle('rotate-180');
            localStorage.setItem('subnav-' + id, isHidden ? 'open' : 'closed');
        }

        // highlight.js + mermaid rendering
        function renderMermaidBlocks(root) {
            root.querySelectorAll('pre code.language-mermaid').forEach(function(codeEl) {
                var pre = codeEl.parentElement;
                var container = document.createElement('div');
                container.className = 'mermaid';
                container.textContent = codeEl.textContent;
                pre.replaceWith(container);
            });
            if (root.querySelectorAll('.mermaid').length > 0) {
                mermaid.run({ nodes: root.querySelectorAll('.mermaid') });
            }
        }

        // Dark mode toggle
        function toggleDarkMode() {
            var isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateDarkModeIcon();
        }
        function updateDarkModeIcon() {
            var icon = document.getElementById('dark-mode-icon');
            if (icon) {
                icon.className = document.documentElement.classList.contains('dark')
                    ? 'fa-solid fa-sun text-sm' : 'fa-solid fa-moon text-sm';
            }
        }
        updateDarkModeIcon();

        hljs.highlightAll();
        renderMermaidBlocks(document);

        document.body.addEventListener('htmx:afterSwap', function(event) {
            event.detail.target.querySelectorAll('pre code').forEach(function(el) {
                if (!el.classList.contains('language-mermaid')) {
                    hljs.highlightElement(el);
                }
            });
            renderMermaidBlocks(event.detail.target);
        });
    </script>

    <!-- Image Modal (click-to-enlarge) -->
    <div id="image-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 hidden" onclick="closeImageModal()">
        <div class="relative max-w-[90vw] max-h-[90vh]" onclick="event.stopPropagation()">
            <img id="image-modal-img" src="" alt="" class="max-w-full max-h-[90vh] rounded-xl shadow-2xl">
            <button onclick="closeImageModal()" class="absolute -top-3 -right-3 w-8 h-8 bg-white dark:bg-gray-800 rounded-full shadow-md flex items-center justify-center text-gray-500 dark:text-gray-400 hover:text-gray-800 dark:hover:text-gray-100 transition-colors cursor-pointer">
                <i class="fa-solid fa-xmark text-sm"></i>
            </button>
        </div>
    </div>
    <script>
        function openImageModal(src, alt) {
            var modal = document.getElementById('image-modal');
            var img = document.getElementById('image-modal-img');
            img.src = src;
            img.alt = alt || '';
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }
        function closeImageModal() {
            var modal = document.getElementById('image-modal');
            modal.classList.add('hidden');
            document.body.style.overflow = '';
        }
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeImageModal();
        });
    </script>

    <!-- htmx error handler -->
    <script>
        document.addEventListener('htmx:responseError', function(e) {
            var target = e.detail.target;
            if (target) {
                target.innerHTML = '<div class="p-4 text-red-500 text-sm">Request failed. Please try again.</div>';
            }
        });
    </script>
</body>
</html>
