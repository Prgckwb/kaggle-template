{% extends "base.html" %}
{% block title %}Error {{ status_code }}{% endblock %}
{% block content %}
<div class="flex flex-col items-center justify-center py-24">
    <div class="w-20 h-20 bg-red-50 rounded-2xl flex items-center justify-center mb-6">
        <i class="fa-solid fa-triangle-exclamation text-red-500 text-3xl"></i>
    </div>
    <h1 class="text-2xl font-extrabold text-gray-800 mb-2">Error {{ status_code }}</h1>
    <p class="text-gray-500 mb-6 text-center max-w-md">{{ message }}</p>
    <a href="/" class="px-6 py-2.5 bg-emerald-500 text-white rounded-full font-bold hover:bg-emerald-600 transition-colors">
        <i class="fa-solid fa-house mr-2"></i>Home
    </a>
</div>
{% endblock %}
